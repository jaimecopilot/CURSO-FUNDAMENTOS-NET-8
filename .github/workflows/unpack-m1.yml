name: Desplegar fuentes M1
on:
  push:
    branches: [ main ]
    paths:
      - '.m1-parts/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir y desplegar M1
        shell: bash
        run: |
          set -euo pipefail
          cat .m1-parts/part01 .m1-parts/part02 .m1-parts/part03 .m1-parts/part04 .m1-parts/part05 .m1-parts/part06 > /tmp/M1_source.tar.xz
          mkdir -p M1
          tar -xJf /tmp/M1_source.tar.xz -C M1
          rm -rf .m1-parts

      - name: Publicar fuentes navegables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Despliega fuentes navegables del módulo 1"
          git push
